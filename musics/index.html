<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>AWMgt - Ultra Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
    :root {
        --primary: #00f3ff;
        --secondary: #bc13fe;
        --glass: rgba(15, 15, 25, 0.7);
        --border: rgba(255, 255, 255, 0.1);
        --track-bg: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; outline: none; user-select: none; }

    body {
        margin: 0;
        height: 100vh;
        background: #020202;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    /* ================= FUNDO REATIVO AMBILIGHT ================= */
    #ambilight-canvas {
        position: fixed;
        top: -10%; left: -10%;
        width: 120%; height: 120%;
        z-index: 0;
        filter: blur(80px) brightness(0.5);
        opacity: 0.6;
        transition: transform 0.05s ease-out, filter 0.05s ease-out;
    }

    /* ================= APP CONTAINER ================= */
    .app {
        position: relative;
        z-index: 10;
        display: grid;
        grid-template-columns: 1fr 320px;
        width: 95%;
        max-width: 1500px;
        height: 85vh;
        gap: 25px;
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 24px;
        backdrop-filter: blur(25px);
        box-shadow: 0 0 60px rgba(0,0,0,0.6);
        padding: 25px;
    }

    /* ================= ÁREA DE VÍDEO ================= */
    .video-area {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #000;
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        border: 1px solid #222;
    }

    /* Wrapper para o efeito de Shake no vídeo */
    .video-wrapper {
        width: 100%; height: 100%;
        position: relative;
        transition: transform 0.05s ease-out;
    }

    video { width: 100%; height: 100%; object-fit: contain; }

    /* Visualizer Canvas (Sobre o vídeo) */
    #viz {
        position: absolute;
        bottom: 0; left: 0;
        width: 100%; height: 140px;
        pointer-events: none;
        mix-blend-mode: screen;
        z-index: 5;
    }

    /* ================= BARRA DE PROGRESSO ================= */
    .progress-container {
        position: absolute; bottom: 0; left: 0;
        width: 100%; height: 6px;
        background: rgba(255,255,255,0.1);
        cursor: pointer; z-index: 20;
        transition: height 0.2s;
    }
    .progress-container:hover { height: 12px; }
    
    .progress-bar {
        height: 100%; width: 0%;
        background: var(--primary);
        box-shadow: 0 0 15px var(--primary);
        border-radius: 0 5px 5px 0;
        position: relative;
    }
    /* Bolinha na ponta da barra */
    .progress-bar::after {
        content: ''; position: absolute; right: -5px; top: 50%;
        transform: translateY(-50%);
        width: 10px; height: 10px;
        background: #fff; border-radius: 50%;
        box-shadow: 0 0 10px #fff;
        opacity: 0; transition: opacity 0.2s;
    }
    .progress-container:hover .progress-bar::after { opacity: 1; }

    /* ================= CONTROLES FLUTUANTES & VOLUME ================= */
    .controls-overlay {
        position: absolute;
        bottom: 30px; left: 50%;
        transform: translateX(-50%);
        background: rgba(10, 10, 10, 0.85);
        padding: 12px 30px;
        border-radius: 60px;
        display: flex;
        align-items: center;
        gap: 25px;
        border: 1px solid rgba(255,255,255,0.15);
        opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        z-index: 15;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .video-area:hover .controls-overlay { opacity: 1; bottom: 40px; }

    .btn {
        background: none; border: none;
        color: white; font-size: 1.4rem;
        cursor: pointer; transition: 0.2s;
        display: flex; align-items: center; justify-content: center;
    }
    .btn:hover { color: var(--primary); transform: scale(1.2); text-shadow: 0 0 15px var(--primary); }

    /* ESTILO DO VOLUME (Slider Bonito) */
    .volume-box {
        display: flex; align-items: center; gap: 10px;
        border-left: 1px solid rgba(255,255,255,0.2);
        padding-left: 20px;
    }

    input[type=range] {
        -webkit-appearance: none;
        width: 100px; background: transparent;
    }
    
    input[type=range]::-webkit-slider-runnable-track {
        width: 100%; height: 4px;
        cursor: pointer; background: rgba(255,255,255,0.2);
        border-radius: 2px;
    }
    
    input[type=range]::-webkit-slider-thumb {
        height: 14px; width: 14px;
        border-radius: 50%;
        background: var(--primary);
        cursor: pointer;
        -webkit-appearance: none;
        margin-top: -5px; /* Centralizar no track */
        box-shadow: 0 0 10px var(--primary);
        transition: transform 0.2s;
    }
    
    input[type=range]:hover::-webkit-slider-thumb { transform: scale(1.3); }

    /* ================= PLAYLIST ================= */
    .playlist-sidebar {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 18px;
        padding: 20px;
        display: flex; flex-direction: column;
        border: 1px solid var(--border);
    }

    .playlist-header {
        font-size: 1.1rem; margin-bottom: 20px;
        text-transform: uppercase; letter-spacing: 3px;
        color: var(--secondary); font-weight: bold;
        text-align: center; border-bottom: 1px solid var(--border);
        padding-bottom: 15px; text-shadow: 0 0 10px rgba(188, 19, 254, 0.4);
    }

    .playlist-items { overflow-y: auto; flex: 1; padding-right: 5px; }

    .track {
        display: flex; align-items: center;
        padding: 14px; margin-bottom: 8px;
        border-radius: 10px; cursor: pointer;
        background: rgba(255,255,255,0.03);
        transition: 0.3s; border-left: 3px solid transparent;
        font-size: 0.95rem; position: relative; overflow: hidden;
    }
    .track:hover { background: rgba(255,255,255,0.08); padding-left: 18px; }
    
    .track.active {
        background: linear-gradient(90deg, rgba(0, 243, 255, 0.1), transparent);
        border-left: 3px solid var(--primary);
        color: var(--primary); font-weight: bold;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }

    /* Tela Inicial */
    #start-screen {
        position: absolute; inset: 0;
        background: #000;
        display: flex; flex-direction: column;
        justify-content: center; align-items: center;
        z-index: 50; transition: opacity 0.5s;
    }
    .start-btn {
        padding: 15px 50px; font-family: 'Rajdhani', sans-serif;
        font-size: 1.5rem; background: transparent;
        color: var(--primary); border: 2px solid var(--primary);
        border-radius: 50px; cursor: pointer;
        box-shadow: 0 0 20px var(--primary);
        text-transform: uppercase; font-weight: bold;
        transition: 0.3s; letter-spacing: 2px;
    }
    .start-btn:hover { background: var(--primary); color: #000; box-shadow: 0 0 60px var(--primary); }

</style>
</head>

<body>

    <!-- Canvas do Fundo Ambilight Reativo -->
    <canvas id="ambilight-canvas"></canvas>

    <div class="app">
        <!-- Tela de Início -->
        <div id="start-screen">
            <h1 style="color:white; margin-bottom:30px; letter-spacing:5px;">AWMgt <span style="color:var(--primary)">//</span> SYSTEM</h1>
            <button class="start-btn" id="init-btn">CONECTAR</button>
        </div>

        <!-- Área Principal -->
        <div class="video-area">
            <div class="video-wrapper" id="video-wrapper">
                <video id="video" crossorigin="anonymous"></video>
            </div>
            
            <canvas id="viz"></canvas>

            <div class="progress-container" id="prog-container">
                <div class="progress-bar" id="prog-bar"></div>
            </div>

            <!-- Controles + Volume -->
            <div class="controls-overlay">
                <button class="btn" id="prev-btn">⏮</button>
                <button class="btn" id="play-pause-btn">▶</button>
                <button class="btn" id="next-btn">⏭</button>
                
                <!-- Volume Bonito -->
                <div class="volume-box">
                    <button class="btn" id="vol-icon" style="font-size:1.1rem">🔊</button>
                    <input type="range" id="vol-slider" min="0" max="1" step="0.05" value="1">
                </div>
            </div>
        </div>

        <!-- Lateral -->
        <div class="playlist-sidebar">
            <div class="playlist-header">LISTA DE FAIXAS</div>
            <div class="playlist-items" id="playlist"></div>
        </div>
    </div>

<script>
    // ==========================================
    // CONFIGURAÇÃO DOS ARQUIVOS
    // ==========================================
    const tracks = [
        "Specterr_720p_Pulso-da-Noite.mp4",
        "Specterr_720p_Pobre-Freestyle.mp4",
        "Specterr_720p_Conexão-Errada.mp4",
        "Specterr_720p_Entre-Pixels-e-Emoção.mp4",
        "Specterr_720p_Através-dela.mp4"
    ];

    // Elementos DOM
    const video = document.getElementById("video");
    const videoWrapper = document.getElementById("video-wrapper");
    const canvasViz = document.getElementById("viz");
    const ctxViz = canvasViz.getContext("2d");
    const canvasAmb = document.getElementById("ambilight-canvas");
    const ctxAmb = canvasAmb.getContext("2d");
    
    const playlistEl = document.getElementById("playlist");
    const playBtn = document.getElementById("play-pause-btn");
    const progBar = document.getElementById("prog-bar");
    const progContainer = document.getElementById("prog-container");
    const startScreen = document.getElementById("start-screen");
    const volSlider = document.getElementById("vol-slider");
    const volIcon = document.getElementById("vol-icon");

    let currentTrackIndex = 0;
    let audioCtx, analyser, source;
    let isAudioInitialized = false;

    // ==========================================
    // ÁUDIO & VISUALIZER
    // ==========================================
    function initAudioContext() {
        if(isAudioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256; 
            analyser.smoothingTimeConstant = 0.8;

            source = audioCtx.createMediaElementSource(video);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);

            isAudioInitialized = true;
            loopRender();
        } catch(e) {
            console.error(e);
            alert("Use Live Server para reatividade de áudio!");
        }
    }

    // ==========================================
    // LOOP GRÁFICO (Onde a mágica acontece)
    // ==========================================
    function loopRender() {
        requestAnimationFrame(loopRender);

        // Ajusta tamanho dos Canvas
        if (canvasViz.width !== canvasViz.offsetWidth) {
            canvasViz.width = canvasViz.offsetWidth;
            canvasViz.height = canvasViz.offsetHeight;
        }
        if (canvasAmb.width !== canvasAmb.offsetWidth) {
            canvasAmb.width = canvasAmb.offsetWidth;
            canvasAmb.height = canvasAmb.offsetHeight;
        }

        if(!isAudioInitialized) return;

        // Pega dados do áudio
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        analyser.getByteFrequencyData(dataArray);

        // --- CÁLCULO DE GRAVES (BASS) ---
        let bassTotal = 0;
        let bassRange = 10; 
        for(let i=0; i<bassRange; i++) bassTotal += dataArray[i];
        let bassAvg = bassTotal / bassRange; // Média de graves (0 a 255)

        // --- 1. FUNDO REATIVO (AMBILIGHT + PULSE) ---
        if (!video.paused && !video.ended) {
            // Desenha o vídeo no fundo
            ctxAmb.drawImage(video, 0, 0, canvasAmb.width, canvasAmb.height);
        }
        
        // Efeito de "Respirar" no fundo com o beat
        // Mais grave = Mais Zoom e Mais Brilho
        let bgScale = 1.0 + (bassAvg / 1500); // Zoom sutil
        let bgBright = 0.4 + (bassAvg / 500); // Brilho oscilante
        
        canvasAmb.style.transform = `scale(${bgScale})`;
        canvasAmb.style.filter = `blur(80px) brightness(${bgBright})`;


        // --- 2. VÍDEO SHAKE ---
        let videoScale = 1 + (bassAvg / 7000); 
        videoWrapper.style.transform = `scale(${videoScale})`;

        // --- 3. BARRAS DO VISUALIZER ---
        ctxViz.clearRect(0, 0, canvasViz.width, canvasViz.height);
        const width = canvasViz.width;
        const height = canvasViz.height;
        const barWidth = (width / bufferLength) * 2.5;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
            let barHeight = (dataArray[i] / 255) * height * 0.9;

            // Gradiente Neon
            let r = i * 2;
            let g = 255 - (i * 2);
            let b = 255;

            ctxViz.fillStyle = `rgb(${r},${g},${b})`;
            ctxViz.shadowBlur = 20;
            ctxViz.shadowColor = `rgb(${r},${g},${b})`;

            // Desenha a barra
            ctxViz.fillRect(x, height - barHeight, barWidth, barHeight);
            x += barWidth + 2;
        }
    }

    // ==========================================
    // LÓGICA DE UI
    // ==========================================
    
    // Volume System
    volSlider.oninput = () => {
        video.volume = volSlider.value;
        updateVolIcon();
    };

    function updateVolIcon() {
        if(video.volume == 0) volIcon.innerText = "🔇";
        else if(video.volume < 0.5) volIcon.innerText = "🔉";
        else volIcon.innerText = "🔊";
    }

    volIcon.onclick = () => {
        if(video.volume > 0) {
            video.dataset.lastVol = video.volume;
            video.volume = 0;
            volSlider.value = 0;
        } else {
            video.volume = video.dataset.lastVol || 1;
            volSlider.value = video.volume;
        }
        updateVolIcon();
    }

    // Playlist Logic
    tracks.forEach((track, i) => {
        const div = document.createElement("div");
        div.className = "track";
        let cleanName = track.replace("Specterr_720p_", "").replace(/-/g, " ").replace(".mp4", "");
        
        div.innerHTML = `
            <span style="font-weight:bold; color:var(--secondary); margin-right:15px; font-size:0.8rem">0${i+1}</span>
            <span>${cleanName}</span>
        `;
        
        div.onclick = () => loadTrack(i);
        div.id = `track-${i}`;
        playlistEl.appendChild(div);
    });

    function loadTrack(index) {
        currentTrackIndex = index;
        video.src = tracks[index];
        video.play().catch(()=>{});
        playBtn.innerText = "❚❚";
        
        document.querySelectorAll(".track").forEach(t => t.classList.remove("active"));
        document.getElementById(`track-${index}`).classList.add("active");
        
        if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    }

    document.getElementById("init-btn").onclick = () => {
        startScreen.style.opacity = 0;
        setTimeout(() => startScreen.style.display = "none", 500);
        initAudioContext();
        loadTrack(0);
    };

    playBtn.onclick = () => {
        if(video.paused) { video.play(); playBtn.innerText = "❚❚"; } 
        else { video.pause(); playBtn.innerText = "▶"; }
    };

    document.getElementById("next-btn").onclick = () => {
        loadTrack((currentTrackIndex + 1) % tracks.length);
    };
    document.getElementById("prev-btn").onclick = () => {
        loadTrack((currentTrackIndex - 1 + tracks.length) % tracks.length);
    };

    video.ontimeupdate = () => {
        let pct = (video.currentTime / video.duration) * 100;
        progBar.style.width = pct + "%";
    };

    progContainer.onclick = (e) => {
        video.currentTime = (e.offsetX / progContainer.clientWidth) * video.duration;
    };

    video.onended = () => document.getElementById("next-btn").click();

</script>
</body>
</html>
