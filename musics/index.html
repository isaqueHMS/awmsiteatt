<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>AWMgt - Ultra Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">

<style>
    :root {
        --primary: #00f3ff;
        --secondary: #bc13fe;
        --glass: rgba(15, 15, 25, 0.7);
        --border: rgba(255, 255, 255, 0.1);
    }

    * { box-sizing: border-box; outline: none; user-select: none; }

    body {
        margin: 0;
        height: 100vh;
        background: #020202;
        font-family: 'Rajdhani', sans-serif;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
    }

    /* ===== BOTÃO DE DOAÇÃO ===== */
    .coffee-btn {
        position: fixed;
        bottom: 25px;
        right: 25px;
        z-index: 999;
        padding: 14px 28px;
        font-size: 15px;
        font-weight: 700;
        color: #000;
        background: linear-gradient(135deg, #00f3ff, #bc13fe);
        border-radius: 999px;
        text-decoration: none;
        box-shadow: 0 0 25px rgba(0,243,255,0.6);
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        letter-spacing: 1px;
    }

    .coffee-btn:hover {
        transform: translateY(-2px) scale(1.03);
        box-shadow: 0 0 45px rgba(188,19,254,0.9);
    }

    .coffee-btn:active {
        transform: scale(0.96);
    }

    /* ===== PLAYER ===== */
    #ambilight-canvas {
        position: fixed; top: -10%; left: -10%; width: 120%; height: 120%;
        z-index: 0; filter: blur(80px) brightness(0.5); opacity: 0.6;
        transition: transform 0.05s ease-out, filter 0.05s ease-out;
    }

    .app {
        position: relative; z-index: 10;
        display: grid; grid-template-columns: 1fr 320px;
        width: 95%; max-width: 1500px; height: 85vh;
        gap: 25px; background: var(--glass);
        border: 1px solid var(--border); border-radius: 24px;
        backdrop-filter: blur(25px); box-shadow: 0 0 60px rgba(0,0,0,0.6);
        padding: 25px;
    }

    .video-area {
        position: relative; display: flex; flex-direction: column;
        justify-content: center; background: #000;
        border-radius: 18px; overflow: hidden;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5); border: 1px solid #222;
    }

    .video-wrapper { width: 100%; height: 100%; position: relative; }

    video { width: 100%; height: 100%; object-fit: contain; }

    #viz {
        position: absolute; bottom: 0; left: 0;
        width: 100%; height: 140px; pointer-events: none;
        mix-blend-mode: screen; z-index: 5;
    }

    .progress-container {
        position: absolute; bottom: 0; left: 0;
        width: 100%; height: 6px; background: rgba(255,255,255,0.1);
        cursor: pointer; z-index: 20;
    }

    .progress-bar {
        height: 100%; width: 0%;
        background: var(--primary);
        box-shadow: 0 0 15px var(--primary);
    }

    .controls-overlay {
        position: absolute; bottom: 30px; left: 50%;
        transform: translateX(-50%);
        background: rgba(10, 10, 10, 0.85);
        padding: 12px 30px;
        border-radius: 60px;
        display: flex; align-items: center; gap: 25px;
        opacity: 0; transition: 0.4s;
    }

    .video-area:hover .controls-overlay { opacity: 1; }

    .btn {
        background: none; border: none;
        color: white; font-size: 1.4rem;
        cursor: pointer;
    }

    .playlist-sidebar {
        background: rgba(0, 0, 0, 0.2);
        border-radius: 18px;
        padding: 20px;
        display: flex; flex-direction: column;
    }

    .playlist-header {
        font-size: 1.1rem;
        margin-bottom: 20px;
        text-align: center;
        color: var(--secondary);
        font-weight: bold;
    }

    .playlist-items { overflow-y: auto; flex: 1; }

    .track {
        padding: 14px;
        margin-bottom: 8px;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.3s;
    }

    .track.active {
        color: var(--primary);
        font-weight: bold;
    }

    #start-screen {
        position: absolute; inset: 0;
        background: #000;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 50;
    }

    .start-btn {
        padding: 15px 50px;
        font-size: 1.5rem;
        background: transparent;
        color: var(--primary);
        border: 2px solid var(--primary);
        border-radius: 50px;
        cursor: pointer;
    }
</style>
</head>

<body>

<canvas id="ambilight-canvas"></canvas>

<a class="coffee-btn"
   href="https://nubank.com.br/cobrar/6p92as/695c4602-5d8b-45ff-b8b7-c81ec3875d0f"
   target="_blank">
   ☕ Me pague um café
</a>

<div class="app">
    <div id="start-screen">
        <h1>AWMgt //</h1>
        <button class="start-btn" id="init-btn">CONECTAR</button>
    </div>

    <div class="video-area">
        <div class="video-wrapper">
            <video id="video"></video>
        </div>
        <canvas id="viz"></canvas>
        <div class="progress-container">
            <div class="progress-bar" id="prog-bar"></div>
        </div>
    </div>

    <div class="playlist-sidebar">
        <div class="playlist-header">LISTA DE FAIXAS</div>
        <div class="playlist-items" id="playlist"></div>
    </div>
</div>

<script>
const tracks = [
 { file: "pulso.mp4", title: "Pulso da Noite" },
 { file: "freestyle.mp4", title: "Pobre Freestyle" },
 { file: "conexao.mp4", title: "Conexão Errada" },
 { file: "pixels.mp4", title: "Entre Pixels e Emoção" },
 { file: "atraves.mp4", title: "Através Dela" },
 { file: "Fantasma.mp4", title: "Fantasma Urbano" },
 { file: "noite.mp4", title: "Fim de Noite" }
];

const video = document.getElementById("video");
const playlist = document.getElementById("playlist");
const progBar = document.getElementById("prog-bar");
let current = 0;

tracks.forEach((t,i)=>{
 const div = document.createElement("div");
 div.className="track";
 div.innerText = t.title;
 div.onclick=()=>load(i);
 playlist.appendChild(div);
});

function load(i){
 current=i;
 video.src=tracks[i].file;
 video.play();
 document.querySelectorAll(".track").forEach(t=>t.classList.remove("active"));
 playlist.children[i].classList.add("active");
}

document.getElementById("init-btn").onclick=()=>{
 document.getElementById("start-screen").style.display="none";
 load(0);
};

video.ontimeupdate=()=>{
 progBar.style.width=(video.currentTime/video.duration*100)+"%";
};
</script>

</body>
</html>
